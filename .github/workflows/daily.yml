name: Daily arXiv podcast episode

# --- IMPORTANT: script-generation auth is not wired up for CI yet -----------
# script.py's default backend (SCRIPT_BACKEND=cli) shells out to `claude -p`
# using an interactive Claude Code login session, which does not exist on a
# GitHub Actions runner. This workflow is fully built out end-to-end (fetch,
# Piper setup+caching, synth, publish, commit, Pages), but the script step
# will fail until one of these is done:
#   (a) implement arxiv_podcast/script.py::_call_model_api() to call the
#       Anthropic SDK, add an ANTHROPIC_API_KEY repository secret, and set
#       SCRIPT_BACKEND=api below, or
#   (b) export Claude Code CLI credentials as a secret and adapt
#       _call_model_cli() to use them non-interactively.
# See the plan / README for context - this was intentionally deferred until
# the manual test episodes (produced locally via `claude -p`) looked good.
# ------------------------------------------------------------------------------

on:
  schedule:
    # ~07:00 UTC daily, after arXiv's overnight announcement batch lands.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # SCRIPT_BACKEND: api
  # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  build-episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Piper binary + voice models
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-${{ runner.os }}-${{ runner.arch }}-hfc_female-medium-ryan-high

      - name: Set up Piper TTS
        run: bash scripts/setup_piper.sh

      - name: Generate today's episode
        run: python -m arxiv_podcast.main

      - name: Commit and push generated episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit (episode already existed or run was a no-op)."
          else
            git commit -m "Add episode for $(date -u +%Y-%m-%d)"
            git push
          fi

  # GitHub Pages should be configured once, in repo Settings -> Pages, to
  # serve from the `main` branch `/docs` folder. Once that's set, pushing to
  # docs/ (above) is all that's needed for Pages to pick up new episodes -
  # no separate deploy step required.
