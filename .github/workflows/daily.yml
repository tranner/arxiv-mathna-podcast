name: Daily arXiv podcast episode

# Script generation uses the Anthropic API (not `claude -p`, which needs an
# interactive login this runner doesn't have) - requires an ANTHROPIC_API_KEY
# repository secret. Settings -> Secrets and variables -> Actions -> New
# repository secret. See README "Automating the daily run".

on:
  schedule:
    # ~07:00 UTC, Mon-Fri, after arXiv's overnight announcement batch lands.
    # arXiv doesn't announce on weekends (its RSS feed just keeps serving
    # Friday's cached batch) - main.py also guards against generating a
    # duplicate episode from a stale feed, but there's no reason to run at
    # all on a day arXiv never publishes anything new.
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  SCRIPT_BACKEND: api
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  build-episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Piper binary + voice models
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-${{ runner.os }}-${{ runner.arch }}-northern_english_male-cori

      - name: Set up Piper TTS
        run: bash scripts/setup_piper.sh

      - name: Fetch existing pages branch content
        run: bash scripts/fetch_pages_branch.sh

      - name: Generate today's episode
        run: uv run python -m arxiv_podcast.main

      - name: Publish to pages branch (squashed history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/publish_pages_branch.sh --push

  # GitHub Pages should be configured once, in repo Settings -> Pages, to
  # serve from the `pages` branch, `/ (root)` folder - NOT `main`. `main`
  # never contains docs/ (see .gitignore); every run replaces the `pages`
  # branch's entire history with one fresh commit (scripts/publish_pages_
  # branch.sh), so its repo size tracks the current episode retention
  # window (EPISODE_RETENTION_DAYS), not the full history of the podcast.
