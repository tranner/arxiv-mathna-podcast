name: Daily arXiv podcast episode

# Script generation uses the Anthropic API (not `claude -p`, which needs an
# interactive login this runner doesn't have) - requires an ANTHROPIC_API_KEY
# repository secret. Settings -> Secrets and variables -> Actions -> New
# repository secret. See README "Automating the daily run".

on:
  schedule:
    # rss.arxiv.org rebuilds at midnight US Eastern: 05:00 UTC in winter
    # (EST), 04:00 UTC in summer (EDT). Cron is UTC-only, so the primary run
    # is just after 05:00 UTC to be safe all year. The minutes are
    # deliberately not :00 - GitHub's scheduler is overloaded at the top of
    # the hour and on-the-hour jobs are often delayed by an hour or more.
    #
    # The 07:43 run is a backup in case the primary is delayed/dropped or
    # starts before arXiv's rebuild. It's a no-op if the primary already
    # succeeded (main.py skips when today's episode exists, or when the feed
    # still holds the batch the last episode covered).
    #
    # Mon-Fri only: arXiv doesn't announce on weekends (its RSS feed just
    # keeps serving Friday's cached batch).
    - cron: "17 5 * * 1-5"
    - cron: "43 7 * * 1-5"
  workflow_dispatch: {}

# Never let the backup run overlap a slow primary - both would build and
# force-push the pages branch.
concurrency:
  group: daily-episode
  cancel-in-progress: false

permissions:
  contents: write

env:
  SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  SCRIPT_BACKEND: api
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # Daily scores email (optional - skipped if unset). See README "Daily scores email".
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  EMAIL_FROM: ${{ vars.EMAIL_FROM }}

jobs:
  build-episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Piper binary + voice models
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-${{ runner.os }}-${{ runner.arch }}-northern_english_male-cori

      - name: Set up Piper TTS
        run: bash scripts/setup_piper.sh

      - name: Fetch existing pages branch content
        run: bash scripts/fetch_pages_branch.sh

      - name: Generate today's episode
        run: uv run python -m arxiv_podcast.main

      - name: Publish to pages branch (squashed history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/publish_pages_branch.sh --push

  # GitHub Pages should be configured once, in repo Settings -> Pages, to
  # serve from the `pages` branch, `/ (root)` folder - NOT `main`. `main`
  # never contains docs/ (see .gitignore); every run replaces the `pages`
  # branch's entire history with one fresh commit (scripts/publish_pages_
  # branch.sh), so its repo size tracks the current episode retention
  # window (EPISODE_RETENTION_DAYS), not the full history of the podcast.
